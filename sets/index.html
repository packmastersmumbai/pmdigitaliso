: "Other — SIGN", "blurb": "", "docs": [{"code": "SIGN_AREA_HazWaste", "t": "AREA Haz Waste", "why": "", "v": "1.0", "f": "SIGN_AREA_HazWaste.html"}, {"code": "SIGN_AREA_Rejection", "t": "AREA Rejection", "why": "", "v": "1.0", "f": "SIGN_AREA_Rejection.html"}, {"code": "SIGN_AREA_Rework", "t": "AREA Rework", "why": "", "v": "1.0", "f": "SIGN_AREA_Rework.html"}, {"code": "SIGN_AREA_Scrap", "t": "AREA Scrap", "why": "", "v": "1.0", "f": "SIGN_AREA_Scrap.html"}, {"code": "SIGN_AREA_Wastage", "t": "AREA Wastage", "why": "", "v": "1.0", "f": "SIGN_AREA_Wastage.html"}, {"code": "SIGN_HAZ_Adhesives", "t": "HAZ Adhesives", "why": "", "v": "1.0", "f": "SIGN_HAZ_Adhesives.html"}, {"code": "SIGN_HAZ_ElectricalPanels", "t": "HAZ Electrical Panels", "why": "", "v": "1.0", "f": "SIGN_HAZ_ElectricalPanels.html"}, {"code": "SIGN_HAZ_LidPress", "t": "HAZ Lid Press", "why": "", "v": "1.0", "f": "SIGN_HAZ_LidPress.html"}, {"code": "SIGN_HAZ_MaterialHandling", "t": "HAZ Material Handling", "why": "", "v": "1.0", "f": "SIGN_HAZ_MaterialHandling.html"}, {"code": "SIGN_HAZ_MotorPumps", "t": "HAZ Motor Pumps", "why": "", "v": "1.0", "f": "SIGN_HAZ_MotorPumps.html"}, {"code": "SIGN_HAZ_StorageVessel", "t": "HAZ Storage Vessel", "why": "", "v": "1.0", "f": "SIGN_HAZ_StorageVessel.html"}]}, {"name": "Other — ST", "blurb": "", "docs": [{"code": "PM/QSP/ST-01", "t": "Receipt and Inspection of Raw Materials & Consumables", "why": "", "v": "1.0", "f": "PM_QSP_ST-01.html"}, {"code": "PM/QSP/ST-02", "t": "Storage and Issue System of Raw Material", "why": "", "v": "1.0", "f": "PM_QSP_ST-02.html"}]}, {"name": "Other — STR", "blurb": "", "docs": [{"code": "PM/FRM/STR-01", "t": "Goods Receipt Note (GRN)", "why": "", "v": "1.0", "f": "PM_FRM_STR-01.html"}, {"code": "PM/FRM/STR-02", "t": "Gate Pass — Material Outward", "why": "", "v": "1.0", "f": "PM_FRM_STR-02.html"}]}, {"name": "Other — SUP", "blurb": "", "docs": [{"code": "PM/REG/SUP-01", "t": "Approved Vendor & Supplier Register", "why": "", "v": "1.0", "f": "PM_REG_SUP-01.html"}]}], PAGES="../html/", cur=0, curDoc=null;
var side=document.getElementById('side'), fr=document.getElementById('fr'),
    pbar=document.getElementById('pbar'), empty=document.getElementById('empty');
function render(){
  side.innerHTML='';
  SETS.forEach(function(s,i){
    var row=document.createElement('div');
    row.className='setrow'+(i===cur?' on':'');
    var b=document.createElement('button');
    b.className='setbtn';
    b.innerHTML='<span>'+s.name+'</span><small>'+s.docs.length+' documents'+(s.blurb?' · '+s.blurb:'')+'</small>';
    b.onclick=function(){cur=i;render();};
    var dl=document.createElement('button');
    dl.className='dl'; dl.textContent='⤓';
    dl.title='Download all '+s.docs.length+' documents in this set as one ZIP of HTML';
    dl.setAttribute('aria-label','Download '+s.name+' as a ZIP of HTML');
    dl.onclick=function(e){e.stopPropagation();zipSet(s,dl);};
    var pd=document.createElement('button');
    pd.className='dl pdf'; pd.textContent='PDF';
    pd.title='Open all '+s.docs.length+' documents as one print view — save as a single PDF';
    pd.setAttribute('aria-label','Print or save '+s.name+' as one PDF');
    pd.onclick=function(e){e.stopPropagation();pdfSet(s,pd);};
    row.appendChild(b); row.appendChild(pd); row.appendChild(dl);
    side.appendChild(row);
    if(i===cur){
      var box=document.createElement('div'); box.className='doclist';
      s.docs.forEach(function(d){
        var a=document.createElement('a');
        a.className='doc'+(curDoc===d.f?' on':''); a.href='#';
        a.innerHTML='<div class="dc">'+d.code+(d.v?'  ·  Rev '+d.v:'')+'</div>'+
                    '<div class="dt">'+d.t+'</div>'+(d.why?'<div class="dw">'+d.why+'</div>':'');
        a.onclick=function(e){e.preventDefault();open(d);};
        box.appendChild(a);
      });
      var h=document.createElement('div'); h.className='hint';
      h.textContent='Listed in the order the cycle uses them. PDF opens the whole '+
        'set as one print view; ⤓ downloads them as a ZIP of HTML.';
      box.appendChild(h);
      side.appendChild(box);
    }
  });
}
/* Download every document in a set as one ZIP. The pages are self-contained -
   logo, QR and styles are inlined - so a zipped copy opens offline exactly as it
   does here. Fetched in small batches so a 27-document set does not open 27
   connections at once. */
function zipSet(s,btn){
  if(btn.dataset.busy) return;
  btn.dataset.busy='1'; btn.classList.add('busy'); btn.disabled=true;
  var done=0, zip=new JSZip(), folder=zip.folder(s.name.replace(/[\\/:*?"<>|]/g,'-'));
  var tick=function(){ done++; btn.textContent=done+'/'+s.docs.length; };
  var queue=s.docs.slice(), active=0, failed=[];
  function next(){
    if(!queue.length && active===0) return finish();
    while(active<4 && queue.length){
      (function(d){
        active++;
        fetch(PAGES+d.f).then(function(r){
          if(!r.ok) throw new Error(r.status);
          return r.text();
        }).then(function(txt){
          folder.file(d.code.replace(/\//g,'_')+'.html', txt); tick();
        }).catch(function(){ failed.push(d.code); tick(); })
        .then(function(){ active--; next(); });
      })(queue.shift());
    }
  }
  function finish(){
    btn.textContent='zip…';
    zip.generateAsync({type:'blob'}).then(function(blob){
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download='PackMasters — '+s.name+'.zip';
      document.body.appendChild(a); a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);
      btn.classList.remove('busy'); btn.textContent='⤓';
      btn.disabled=false; delete btn.dataset.busy;
      if(failed.length) alert('Could not fetch: '+failed.join(', '));
    });
  }
  next();
}
/* One print view for a whole set, saved as a single PDF by the browser.

   Every document comes from the same generator, so their <style> blocks are the
   same: taking the styles once and then each document's <body> gives one A4
   document that prints with the real letterhead rather than a screenshot of it.
   Scripts and the on-screen toolbar are stripped; the Hindi blocks print as they
   appear on screen. */
function pdfSet(s,btn){
  if(btn.dataset.busy) return;
  btn.dataset.busy='1'; btn.classList.add('busy'); btn.disabled=true;
  var done=0, parts=new Array(s.docs.length), styles=null, failed=[];
  var tick=function(){ done++; btn.textContent=done+'/'+s.docs.length; };
  Promise.all(s.docs.map(function(d,i){
    return fetch(PAGES+d.f).then(function(r){ if(!r.ok) throw 0; return r.text(); })
      .then(function(txt){
        var doc=new DOMParser().parseFromString(txt,'text/html');
        doc.querySelectorAll('script,#bil-toolbar,#bil-top').forEach(function(n){n.remove();});
        if(styles===null){
          styles=Array.prototype.map.call(doc.querySelectorAll('style'),
            function(n){return n.outerHTML;}).join('\n');
        }
        parts[i]='<section class="pgset"><div class="pghdr">'+d.code+
                 (d.v?'  ·  Rev '+d.v:'')+'  —  '+d.t+'</div>'+doc.body.innerHTML+'</section>';
        tick();
      }).catch(function(){ failed.push(d.code); parts[i]=''; tick(); });
  })).then(function(){
    var w=window.open('','_blank');
    if(!w){ alert('Allow pop-ups for this site to use the PDF view.'); reset(); return; }
    w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+
      'Pack Masters — '+s.name+'</title>'+(styles||'')+
      '<style>.pgset{break-after:page;page-break-after:always}'+
      '.pgset:last-child{break-after:auto;page-break-after:auto}'+
      '.pghdr{font:600 8pt Inter,Arial,sans-serif;color:#64748b;margin:0 0 4mm;'+
      'border-bottom:1px solid #cbd5e1;padding-bottom:2mm}'+
      '.cover{font:400 11pt/1.6 Inter,Arial,sans-serif;padding:24mm 18mm;break-after:page;page-break-after:always}'+
      '.cover h1{font-size:20pt;margin:0 0 4mm}.cover ol{margin:6mm 0 0 6mm}'+
      '.cover li{margin-bottom:2mm;font-size:10pt}</style></head><body>'+
      '<div class="cover"><h1>Pack Masters</h1><div style="font-size:13pt;font-weight:500">'+
      s.name+'</div><div style="color:#64748b;margin-top:2mm">'+s.docs.length+
      ' documents · printed '+new Date().toLocaleDateString('en-GB')+'</div><ol>'+
      s.docs.map(function(d){return '<li>'+d.code+(d.v?' · Rev '+d.v:'')+' — '+d.t+'</li>';}).join('')+
      '</ol></div>'+parts.join('')+'</body></html>');
    w.document.close();
    setTimeout(function(){ w.focus(); w.print(); },600);
    reset();
    if(failed.length) alert('Could not fetch: '+failed.join(', '));
  });
  function reset(){ btn.classList.remove('busy'); btn.textContent='PDF';
    btn.disabled=false; delete btn.dataset.busy; }
}
function open(d){
  curDoc=d.f;
  fr.src=PAGES+d.f; fr.style.display='block'; empty.style.display='none';
  pbar.innerHTML='<b>'+d.t+'</b><span style="color:#64748b">'+d.code+(d.v?' · Rev '+d.v:'')+'</span>'+
                 '<a href="'+PAGES+d.f+'" target="_blank">Open in new tab &nearr;</a>';
  render();
}
render();
</script></body></html>
