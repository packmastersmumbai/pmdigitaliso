<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pack Masters — ISO Document Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --white:#ffffff;--bg:#f8fafc;--bg2:#f1f5f9;
  --ink:#0f172a;--ink2:#334155;--ink3:#64748b;--ink4:#94a3b8;
  --border:#e2e8f0;--border2:#cbd5e1;
  --blue:#2563eb;--blue2:#1d4ed8;--blue-soft:#eff6ff;
  --radius:12px;--radius-sm:8px;
  --shadow:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.05);
  --shadow-md:0 4px 12px rgba(15,23,42,.08),0 2px 4px rgba(15,23,42,.04);
  --mono:'JetBrains Mono','SF Mono',monospace;
}
html{font-size:14px;scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}

/* ── HEADER ── */
.hdr{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:0 24px;position:sticky;top:0;z-index:300;
  box-shadow:0 1px 0 var(--border),0 2px 8px rgba(15,23,42,.04);
}
.hdr-inner{max-width:1300px;margin:0 auto;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-mark{
  width:32px;height:32px;border-radius:8px;
  background:linear-gradient(135deg,#2563eb 0%,#7c3aed 100%);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:.7rem;letter-spacing:.05em;flex-shrink:0;
}
.hdr-name{font-size:.95rem;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.hdr-tagline{font-size:.68rem;color:var(--ink3);margin-top:1px}
.hdr-stds{display:flex;gap:4px}
.hdr-std{font-size:.6rem;font-weight:600;border-radius:4px;padding:2px 6px;font-family:var(--mono)}

/* ── STATS ── */
.stats{background:var(--white);border-bottom:1px solid var(--border);padding:0 24px}
.stats-inner{max-width:1300px;margin:0 auto;display:flex;overflow-x:auto}
.stat{flex:1;min-width:80px;padding:10px 20px;border-right:1px solid var(--border);text-align:center}
.stat:last-child{border-right:none}
.stat b{display:block;font-size:1.35rem;font-weight:700;color:var(--blue);font-family:var(--mono);letter-spacing:-.02em}
.stat span{font-size:.6rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px;display:block}

/* ── CHIPS ── */
.chips{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;gap:6px;flex-wrap:wrap}
.chip{
  background:var(--cbg,#f1f5f9);color:var(--cfg,#475569);
  border:1.5px solid transparent;border-radius:20px;
  padding:4px 14px;font-size:.73rem;font-weight:600;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.chip.all{--cbg:#f1f5f9;--cfg:#475569}
.chip:hover{filter:brightness(.96);border-color:color-mix(in srgb,var(--cfg) 30%,transparent)}
.chip.on{
  background:var(--cfg);color:#fff;
  border-color:var(--cfg);
  box-shadow:0 2px 8px color-mix(in srgb,var(--cfg) 30%,transparent);
}

/* ── TOOLBAR ── */
.toolbar{background:var(--white);border-bottom:1px solid var(--border);padding:10px 24px}
.toolbar-inner{max-width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.sw{position:relative;flex:1}
.sw input{
  width:100%;padding:9px 36px 9px 38px;
  background:var(--bg);border:1.5px solid var(--border);border-radius:var(--radius-sm);
  font-size:.875rem;color:var(--ink);outline:none;font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
}
.sw input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
.sw input::placeholder{color:var(--ink4)}
.sw .si{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink4);pointer-events:none;font-size:.88rem}
.sw .sx{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--ink4);font-size:.85rem;display:none;padding:2px;line-height:1}
.frow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.frow select{
  padding:7px 12px;background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);font-size:.8rem;color:var(--ink);cursor:pointer;outline:none;flex:1;min-width:140px;
  transition:border-color .15s;
}
.frow select:focus{border-color:var(--blue)}
.sort-btn{
  padding:7px 14px;background:var(--bg);border:1.5px solid var(--border);
  border-radius:var(--radius-sm);font-size:.78rem;color:var(--ink2);font-weight:500;
  cursor:pointer;white-space:nowrap;transition:all .15s;display:flex;align-items:center;gap:5px;
}
.sort-btn:hover{border-color:var(--blue);color:var(--blue)}
.rst{
  padding:7px 16px;background:var(--blue);color:#fff;border:none;
  border-radius:var(--radius-sm);font-size:.78rem;font-weight:600;cursor:pointer;white-space:nowrap;
  transition:background .15s;
}
.rst:hover{background:var(--blue2)}

/* ── RESULT BAR ── */
.rbar{padding:7px 24px;background:var(--bg);border-bottom:1px solid var(--border)}
.rbar-inner{max-width:1300px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.rbar span{font-size:.72rem;color:var(--ink3)}
.rbar-active{color:var(--blue)!important;font-weight:500}

/* ── MAIN ── */
.main{max-width:1300px;margin:0 auto;padding:20px 24px 60px}

/* ── CATEGORY SECTIONS ── */
.cat-sec{
  margin-bottom:10px;background:var(--white);
  border:1px solid var(--border);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden;
}
.cat-hdr{
  display:flex;align-items:center;justify-content:space-between;
  padding:13px 18px;cursor:pointer;user-select:none;
  transition:background .12s;
}
.cat-hdr:hover{background:var(--bg)}
.cat-hdr-l{display:flex;align-items:center;gap:10px}
.cat-pill{
  font-size:.65rem;font-weight:700;border-radius:6px;
  padding:3px 8px;font-family:var(--mono);letter-spacing:.03em;
}
.cat-name{font-size:.88rem;font-weight:600;color:var(--ink)}
.cat-n{
  font-family:var(--mono);font-size:.68rem;color:var(--ink3);
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:1px 8px;
}
.cat-arrow{color:var(--ink4);font-size:.7rem;transition:transform .2s;margin-left:4px}
.cat-sec.open .cat-arrow{transform:rotate(180deg)}
.cat-body{display:none;border-top:1px solid var(--border)}
.cat-sec.open .cat-body{display:block}

/* ── TABLE ── */
table{width:100%;border-collapse:collapse}
thead th{
  background:var(--bg);color:var(--ink3);font-size:.64rem;font-weight:600;
  text-transform:uppercase;letter-spacing:.08em;padding:8px 16px;
  border-bottom:1px solid var(--border2);text-align:left;white-space:nowrap;
  cursor:pointer;user-select:none;transition:color .12s;
}
thead th:hover{color:var(--blue)}
tbody tr{border-bottom:1px solid var(--border);transition:background .1s;position:relative}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--blue-soft)}
tbody tr:hover .qr-cell{opacity:1;pointer-events:auto}
td{padding:10px 16px;vertical-align:middle;font-size:.83rem}
td.code-cell{font-family:var(--mono);font-size:.73rem;color:var(--ink3);white-space:nowrap;width:160px}
td.title-cell{color:var(--ink);font-weight:500;}
td.title-cell a{color:inherit;text-decoration:none}
td.title-cell a:hover{color:var(--blue)}
td.clause-cell a{
  font-family:var(--mono);font-size:.72rem;color:var(--blue);
  font-weight:600;text-decoration:none;
}
td.clause-cell a:hover{text-decoration:underline}
.std-pill{
  display:inline-block;font-size:.62rem;font-weight:700;
  border-radius:5px;padding:2px 8px;font-family:var(--mono);
}

/* ── QR CELL ── */
/* QR modal */
.qr-modal{
  display:none;position:fixed;inset:0;z-index:500;
  background:rgba(15,23,42,.55);backdrop-filter:blur(4px);
  align-items:center;justify-content:center;
}
.qr-modal.show{display:flex}
.qr-box{
  background:#fff;border-radius:16px;padding:28px;
  text-align:center;box-shadow:0 24px 48px rgba(15,23,42,.2);
  max-width:300px;width:90%;
}
.qr-box img{width:200px;height:200px;border-radius:8px;border:1px solid var(--border)}
.qr-code-label{font-family:var(--mono);font-size:.8rem;color:var(--ink3);margin-top:12px;font-weight:500}
.qr-title-label{font-size:.85rem;color:var(--ink);font-weight:600;margin-top:4px;line-height:1.35}
.qr-url{font-size:.68rem;color:var(--ink4);margin-top:8px;word-break:break-all}
.qr-close{
  margin-top:16px;padding:7px 20px;background:var(--blue);color:#fff;
  border:none;border-radius:8px;font-size:.82rem;font-weight:600;cursor:pointer;
}
.qr-close:hover{background:var(--blue2)}

.no-results{padding:56px;text-align:center;color:var(--ink3);font-size:.88rem}

/* ── QR CELL bigger ── */
.qr-cell{width:60px;text-align:center;opacity:0;transition:opacity .15s}
.qr-cell img{width:52px;height:52px;border-radius:6px;border:1px solid var(--border2);cursor:pointer;display:block;margin:0 auto}

/* ── MOBILE CARDS ── */
@media(min-width:640px){
  .toolbar-inner{flex-direction:row;align-items:center}
  .sw{min-width:280px}
  .frow{flex-wrap:nowrap}
}
@media(max-width:639px){
  .hdr-stds{display:none}
  .hdr-inner{height:52px;gap:8px}
  .hdr-name{font-size:.85rem}
  .stats-inner{gap:0}
  .stat{padding:8px 10px;min-width:60px}
  .stat b{font-size:1.1rem}
  .chips{padding:8px 12px;gap:5px}
  .toolbar{padding:8px 12px}
  .rbar{padding:5px 12px}
  .main{padding:10px 10px 48px}
  /* hide table on mobile, show cards */
  table{display:none}
  .doc-cards{display:block}
  .cat-hdr{padding:11px 14px}
  .cat-body{padding:8px 10px;display:none;border-top:1px solid var(--border)}
  .cat-sec.open .cat-body{display:block}
}
@media(min-width:640px){
  .doc-cards{display:none}
}

/* ── DOC CARD (mobile) ── */
.doc-card{
  background:var(--white);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;margin-bottom:8px;display:flex;flex-direction:column;gap:6px;
}
.doc-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.doc-card-title{font-size:.88rem;font-weight:600;color:var(--ink);line-height:1.35;flex:1}
.doc-card-title a{color:inherit;text-decoration:none}
.doc-card-title a:hover{color:var(--blue)}
.doc-card-qr img{width:56px;height:56px;border-radius:6px;border:1px solid var(--border2);flex-shrink:0;cursor:pointer}
.doc-card-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.doc-card-code{font-family:var(--mono);font-size:.68rem;color:var(--ink3)}
.doc-card-clause{font-family:var(--mono);font-size:.68rem;color:var(--blue);font-weight:600}
</style>







<style id="pf-compact">
/* header: title | standard pills | counts | auditor toggle, all on one line */
.hdr-n{display:flex;align-items:center;gap:9px;margin-left:14px}
.hdr-n .hn{display:flex;align-items:baseline;gap:4px;font-size:10.5px;font-weight:600;
 color:#94a3b8;letter-spacing:.02em;white-space:nowrap}
.hdr-n .hn b{font-size:15px;font-weight:800;color:#0b1524;letter-spacing:-.02em}
.hdr-n i{width:1px;height:14px;background:#e4e9f0}
/* one control row: standards, search, clause, sort, reset */
.ctrl{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);
 backdrop-filter:saturate(1.4) blur(9px);border-bottom:1px solid #e9edf3}
.ctrl-in{max-width:1320px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;gap:8px}
.ctrl .chip{flex:0 0 auto;border:1px solid #e4e9f0;background:var(--cbg,#f4f7fb);
 color:var(--cfg,#64748b);border-radius:999px;padding:5px 11px;font:700 11px/1 inherit;
 cursor:pointer;transition:.14s}
.ctrl .chip:hover{transform:translateY(-1px)}
.ctrl .chip.on{background:#0b1524;color:#fff;border-color:#0b1524}
.ctrl .chip.all{background:#eef2f7;color:#334155}
.ctrl .chip.all.on{background:#0b1524;color:#fff}
.ctrl .sep{width:1px;height:20px;background:#e4e9f0;margin:0 3px}
.ctrl .sw{flex:1 1 auto;min-width:150px;position:relative;display:flex;align-items:center}
.ctrl .sw .si{position:absolute;left:10px;font-size:12px;color:#94a3b8;pointer-events:none}
.ctrl .sw input{width:100%;height:32px;border:1px solid #e4e9f0;border-radius:8px;
 padding:0 28px 0 27px;font:500 12.5px/1 inherit;background:#f8fafc;color:#0b1524}
.ctrl .sw input:focus{outline:0;background:#fff;border-color:#185fa5;
 box-shadow:0 0 0 3px rgba(24,95,165,.12)}
.ctrl .sw .sx{position:absolute;right:6px;border:0;background:0;color:#94a3b8;cursor:pointer;
 font-size:11px;padding:4px;display:none}
.ctrl .sw input:not(:placeholder-shown)~.sx{display:block}
.ctrl select,.ctrl .sort-btn,.ctrl .rst{flex:0 0 auto;height:32px;border:1px solid #e4e9f0;
 border-radius:8px;background:#fff;font:600 11.5px/1 inherit;color:#334155;padding:0 10px;cursor:pointer}
.ctrl select{max-width:130px}
.ctrl .sort-btn:hover,.ctrl .rst:hover,.ctrl select:hover{border-color:#cbd5e1;background:#f8fafc}
.ctrl .rst{background:#0b1524;color:#fff;border-color:#0b1524;font-weight:700}
.ctrl .rst:hover{background:#1c2a3f;border-color:#1c2a3f}
@media (max-width:860px){
  .hdr-n .hn:nth-child(n+3){display:none}
  .hdr-n i:nth-child(n+2){display:none}
}
@media (max-width:720px){
  .hdr-n{display:none}
  .ctrl-in{flex-wrap:wrap;gap:6px;padding:8px 12px}
  .ctrl .sw{flex:1 0 100%;order:-1}
  .ctrl .sep{display:none}
  .ctrl select{max-width:none;flex:1 1 auto}
  .ctrl .chip{padding:5px 9px;font-size:10.5px}
}
body.aud-on .ctrl{display:none}
</style>

<style id="pf-css">
:root{--pf-ink:#0b1524;--pf-mut:#64748b;--pf-line:#e4e9f0}
body.pf-on .rbar,body.pf-on #main{display:none!important}
body.aud-on #pf{display:none!important}
#pf{max-width:1180px;margin:0 auto;padding:14px 16px 56px}
.pf-sp{display:flex;gap:6px;height:112px}
.pf-t{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;
 justify-content:space-between;padding:10px 0;cursor:pointer;position:relative;z-index:1;
 border-radius:12px;transition:transform .18s cubic-bezier(.2,.8,.3,1),background .2s,border-color .2s}
.pf-t:hover{transform:translateY(-2px)}
.pf-t .ic{font-size:16px}
.pf-t .nm{writing-mode:vertical-rl;transform:rotate(180deg);font-size:12px;font-weight:600;
 white-space:nowrap;letter-spacing:.01em}
.pf-t .ct{font-size:10px;font-weight:700;padding:1px 7px;border-radius:999px}
.pf-t.on{z-index:2;border-bottom:0!important;border-radius:12px 12px 0 0;margin-bottom:-3px;padding-bottom:14px}
.pf-sec{border-radius:0 12px 12px 12px;background:#fff;overflow:hidden;
 animation:pfIn .28s cubic-bezier(.2,.8,.3,1)}
@keyframes pfIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pf-hd{display:flex;align-items:center;gap:9px;padding:9px 13px;flex-wrap:wrap}
.pf-hd .ti{font-size:13px;font-weight:700}
.pf-hd .pill{font-size:10.5px;font-weight:700;padding:1px 9px;border-radius:999px;background:#fff}
.pf-fam{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-left:auto;max-width:100%}
.pf-fam::-webkit-scrollbar{display:none}
.pf-fc{flex:0 0 auto;cursor:pointer;border-radius:999px;padding:4px 10px;font-size:11px;
 font-weight:600;white-space:nowrap;background:rgba(255,255,255,.6);border:0.5px solid transparent;
 transition:background .15s,border-color .15s}
.pf-body{display:grid;grid-template-columns:1fr 272px;align-items:start}
.pf-list{border-right:1px solid var(--pf-line);min-width:0}
.pf-r{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--pf-line);
 cursor:pointer;position:relative;transition:background .12s}
.pf-r:hover,.pf-r:focus-visible{background:#f6f9fc;outline:none}
.pf-r.act{background:#eef4fb}
.pf-r.act:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.pf-r code{font-size:10.5px;color:var(--pf-mut);flex:0 0 auto}
.pf-r .tt{flex:1;min-width:0;font-size:12.5px;color:#243044;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-r .sd{flex:0 0 auto;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:5px}
.pf-r .cl{flex:0 0 auto;font-size:10.5px;color:var(--pf-mut);min-width:36px;text-align:right}
.pf-r .ax{flex:0 0 auto;font-size:15px;color:#9aa6b6;opacity:0;transition:opacity .12s,color .15s;
 padding:2px;border-radius:5px}
.pf-r:hover .ax,.pf-r:focus-visible .ax{opacity:1}
.pf-r .ax:hover{color:var(--pf-ink);background:#e8eef6}
.pf-pane{position:sticky;top:8px;background:#f8fafc;min-width:0}
.pf-pane .in{padding:12px 13px}
.pf-ttl{font-size:13px;font-weight:600;line-height:1.35;color:#12203a}
.pf-qr{width:104px;height:104px;image-rendering:pixelated;padding:5px;background:#fff;border:1px solid var(--pf-line);border-radius:7px;display:block}
.pf-cap{font-size:9.5px;color:var(--pf-mut);text-align:center;margin-top:4px}
.pf-lbl{font-size:10px;font-weight:800;color:var(--pf-mut);letter-spacing:.07em;margin:12px 0 2px}
.pf-m{display:flex;align-items:baseline;gap:10px;padding:5px 0;border-bottom:1px solid var(--pf-line)}
.pf-m b{flex:0 0 78px;font-size:10.5px;font-weight:600;color:var(--pf-mut)}
.pf-m span{font-size:11.5px;color:#243044;min-width:0;word-break:break-word}
.pf-m .sub{color:var(--pf-mut);font-size:10.5px}
.pf-lg{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--pf-line)}
.pf-lg .v{flex:0 0 30px;font-size:11px;font-weight:700}
.pf-lg .d{flex:0 0 72px;font-size:11px;color:var(--pf-mut)}
.pf-lg .x{flex:1;font-size:11.5px;line-height:1.5;color:#243044}
.pf-act{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.pf-b{display:inline-flex;align-items:center;gap:5px;border:1px solid #cbd5e1;background:#fff;
 border-radius:8px;padding:6px 11px;font-size:11.5px;font-weight:700;color:#334155;cursor:pointer;
 transition:.15s;text-decoration:none}
.pf-b:hover{background:#f1f5f9;transform:translateY(-1px)}
.pf-empty{padding:26px;text-align:center;color:var(--pf-mut);font-size:12.5px}
@media (max-width:760px){
  #pf{padding:10px 11px 44px}
  .pf-sp{height:auto;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .pf-sp::-webkit-scrollbar{display:none}
  .pf-t{flex:0 0 auto;flex-direction:row;gap:6px;padding:8px 12px!important;margin-bottom:0!important;
   border-radius:999px!important;border-bottom-width:1px!important}
  .pf-t .nm{writing-mode:horizontal-tb;transform:none}
  .pf-sec{border-radius:12px;margin-top:8px}
  .pf-body{grid-template-columns:1fr}
  .pf-list{border-right:0;border-bottom:1px solid var(--pf-line)}
  .pf-pane{position:static}
  .pf-r .ax{opacity:1}
  .pf-hd .pf-fam{margin-left:0;width:100%;order:3}
}
@media print{.hdr,.toolbar,.chips,.stats,.pf-sp,.pf-fam,.pf-act{display:none!important}
  .pf-body{grid-template-columns:1fr}.pf-pane{position:static}}
</style>

<style id="aud-css">
:root{--aud-ink:#0b1524;--aud-mut:#64748b;--aud-line:#e4e9f0;--aud-acc:#c8951f;
 --aud-ok:#14893f;--aud-nc:#cf2b2b;--aud-of:#c07a10;--aud-na:#7c8794;--aud-shadow:0 1px 2px rgba(11,21,36,.06),0 8px 24px -12px rgba(11,21,36,.18)}

/* ── toggle in the portal header ───────────────────────────── */
.aud-toggle{margin-left:auto;display:inline-flex;align-items:center;gap:7px;
 background:linear-gradient(180deg,#f0c14b 0%,#d9a01f 100%);
 color:#2b1d00;border:0;border-radius:999px;padding:9px 17px;font:700 13px/1 inherit;
 cursor:pointer;letter-spacing:.01em;box-shadow:0 2px 10px rgba(217,160,31,.45);
 transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s,filter .16s;white-space:nowrap}
.aud-toggle:hover{transform:translateY(-1px);box-shadow:0 5px 18px rgba(217,160,31,.55);filter:brightness(1.04)}
.aud-toggle:active{transform:translateY(0)}
.aud-toggle .ic{font-size:14px;line-height:1}
.aud-toggle.on{background:linear-gradient(180deg,#1ec37a 0%,#12a163 100%);color:#04241a;
 box-shadow:0 2px 10px rgba(18,161,99,.5)}

/* ── shell ─────────────────────────────────────────────────── */
#aud{display:none}
body.aud-on #aud{display:block;animation:audIn .3s cubic-bezier(.2,.8,.3,1)}
body.aud-on .stats,body.aud-on .chips,body.aud-on .rbar,body.aud-on #main,
body.aud-on .toolbar{display:none!important}
body.aud-on{background:
  radial-gradient(1100px 480px at 12% -12%,rgba(200,149,31,.10),transparent 60%),
  radial-gradient(900px 420px at 92% -6%,rgba(27,108,168,.10),transparent 62%),
  #f7f9fc}
@keyframes audIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.aud-wrap{max-width:1180px;margin:0 auto;padding:14px 16px 56px}

/* ── sticky command bar ────────────────────────────────────── */
.aud-bar{position:sticky;top:0;z-index:40;margin:0 -16px 12px;padding:11px 16px;
 background:rgba(11,21,36,.94);backdrop-filter:blur(14px) saturate(1.3);
 border-bottom:1px solid rgba(255,255,255,.09);
 box-shadow:0 8px 26px -18px rgba(0,0,0,.8)}
.aud-bar-in{max-width:1180px;margin:0 auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.aud-id{display:flex;gap:7px;flex:1;min-width:210px}
.aud-in{flex:1;min-width:0;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
 color:#fff;border-radius:9px;padding:8px 11px;font:600 12.5px/1.2 inherit;transition:.15s}
.aud-in::placeholder{color:rgba(255,255,255,.42);font-weight:500}
.aud-in:focus{outline:0;border-color:var(--aud-acc);background:rgba(255,255,255,.13);
 box-shadow:0 0 0 3px rgba(200,149,31,.22)}
.aud-in::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.6)}
.aud-ring{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:999px;
 background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14)}
.aud-ring svg{display:block}
.aud-ring b{color:#fff;font-size:14px;font-weight:800;line-height:1}
.aud-ring span{display:block;color:rgba(255,255,255,.5);font-size:9px;font-weight:700;
 text-transform:uppercase;letter-spacing:.06em;margin-top:1px}
.aud-x{display:flex;gap:6px;flex-wrap:wrap}
.aud-b{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.09);
 border:1px solid rgba(255,255,255,.17);color:#e8eef6;border-radius:9px;padding:8px 12px;
 font:700 12px/1 inherit;cursor:pointer;transition:.16s;white-space:nowrap}
.aud-b:hover{background:rgba(255,255,255,.19);transform:translateY(-1px)}
.aud-b.gold{background:linear-gradient(180deg,#f0c14b,#d9a01f);color:#2b1d00;border-color:transparent;
 box-shadow:0 2px 10px rgba(217,160,31,.4)}
.aud-b.exit{background:transparent;border-color:rgba(255,255,255,.28)}

/* ── stat strip ────────────────────────────────────────────── */
.aud-kpi{display:flex;gap:7px;overflow-x:auto;padding-bottom:3px;margin-bottom:11px;
 scrollbar-width:none}
.aud-kpi::-webkit-scrollbar{display:none}
.aud-k{flex:1 0 auto;min-width:88px;background:#fff;border:1px solid var(--aud-line);
 border-radius:11px;padding:8px 12px;box-shadow:var(--aud-shadow);position:relative;overflow:hidden}
.aud-k:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--c,#cbd5e1)}
.aud-k b{display:block;font-size:19px;font-weight:800;color:var(--c,var(--aud-ink));line-height:1.1;
 font-variant-numeric:tabular-nums}
.aud-k span{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--aud-mut)}

/* ── one-row tab strip ─────────────────────────────────────── */
.aud-tabs{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:4px;
 background:#eef2f7;border-radius:12px;margin-bottom:9px}
.aud-tabs::-webkit-scrollbar{display:none}
.aud-t{flex:0 0 auto;border:0;background:transparent;color:#54627a;border-radius:9px;
 padding:8px 14px;font:700 12.5px/1 inherit;cursor:pointer;position:relative;
 transition:color .18s,background .18s,box-shadow .18s;white-space:nowrap}
.aud-t:hover{color:var(--aud-ink);background:rgba(255,255,255,.7)}
.aud-t.on{background:#fff;color:var(--aud-ink);box-shadow:0 1px 2px rgba(11,21,36,.1),0 4px 14px -6px rgba(11,21,36,.35)}
.aud-t.on:after{content:"";position:absolute;left:14px;right:14px;bottom:4px;height:2px;border-radius:2px;
 background:linear-gradient(90deg,var(--aud-acc),#e8c46a);box-shadow:0 0 9px rgba(200,149,31,.75)}
.aud-t i{font-style:normal;font-size:10px;font-weight:800;margin-left:5px;padding:1px 6px;
 border-radius:999px;background:rgba(11,21,36,.09);color:#475569}
.aud-t.on i{background:rgba(200,149,31,.16);color:#8a6510}

/* ── filter chips ──────────────────────────────────────────── */
.aud-f{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;margin-bottom:10px;align-items:center}
.aud-f::-webkit-scrollbar{display:none}
.aud-f .lb{flex:0 0 auto;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;
 color:var(--aud-mut);padding-right:2px}
.aud-c{flex:0 0 auto;border:1px solid var(--aud-line);background:#fff;color:#54627a;border-radius:999px;
 padding:6px 12px;font:600 11.5px/1 inherit;cursor:pointer;transition:.15s}
.aud-c:hover{border-color:#c3ccd8}
.aud-c.on{background:var(--aud-ink);border-color:var(--aud-ink);color:#fff;
 box-shadow:0 3px 12px -4px rgba(11,21,36,.6)}
.aud-s{flex:1 0 150px;border:1px solid var(--aud-line);border-radius:999px;padding:7px 13px;
 font:500 12px/1 inherit;background:#fff}
.aud-s:focus{outline:0;border-color:var(--aud-acc);box-shadow:0 0 0 3px rgba(200,149,31,.16)}

/* ── single-line clause rows ───────────────────────────────────
   Everything an auditor marks lives on the row itself: clause, question,
   SQCDP/HESQ lens, the documents that answer it, the four results and a
   comment icon. Nothing expands except the remark box.                    */
.aud-grp{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;
 color:var(--aud-mut);margin:13px 2px 5px}
.aud-r{background:#fff;border:1px solid var(--aud-line);
 border-left:3px solid transparent;border-radius:9px;padding:6px 9px 5px;margin-bottom:3px;
 box-shadow:var(--aud-shadow);transition:border-color .15s,box-shadow .15s,background .15s}
.aud-r1{display:flex;align-items:flex-start;gap:8px}
.aud-r2{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:wrap}
.aud-r:hover{border-color:#cfd8e3;box-shadow:0 2px 8px -3px rgba(11,21,36,.3)}
/* an answered question is tinted and edged in its result colour */
.aud-r.mC{border-left-color:var(--aud-ok);background:rgba(20,137,63,.035);border-color:rgba(20,137,63,.28)}
.aud-r.mNC{border-left-color:var(--aud-nc);background:rgba(207,43,43,.04);border-color:rgba(207,43,43,.3)}
.aud-r.mOFI{border-left-color:var(--aud-of);background:rgba(192,122,16,.045);border-color:rgba(192,122,16,.3)}
.aud-r.mNA{border-left-color:var(--aud-na);background:#f8fafc;opacity:.75}
.aud-r.gap{background:rgba(207,43,43,.035)}
.aud-r.gap.mC,.aud-r.gap.mNC,.aud-r.gap.mOFI,.aud-r.gap.mNA{background:inherit}
.aud-r.open{border-color:#c9d3e0}
.aud-cl{flex:0 0 auto;min-width:38px;text-align:center;
 font:800 10.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
 color:var(--aud-ink);background:#eef2f7;border-radius:5px;padding:4px 6px;letter-spacing:-.02em}
.aud-sd{flex:0 0 auto;width:6px;height:6px;border-radius:50%;margin-top:6px}
/* the question wraps in full - an auditor should never have to hover to read it */
.aud-q{flex:1 1 auto;min-width:120px;font-size:12.4px;line-height:1.4;color:#243044}
.aud-lens{flex:0 0 auto;display:flex;gap:2px;margin-top:1px}
.aud-tag{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
 font-size:8.5px;font-weight:800;border-radius:4px;cursor:default}
.aud-tag.sq{background:#edf4ff;color:#1d5fc4}
.aud-tag.he{background:#eefaf1;color:#14893f}
.aud-dl{flex:1 1 auto;display:flex;gap:3px;align-items:center;flex-wrap:wrap;
 min-width:0;margin-left:46px}
.aud-d{font:700 9.5px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#1d5fc4;
 background:#f2f6fc;border:1px solid #e2ebf8;border-radius:5px;padding:4px 5px;
 text-decoration:none;transition:.13s}
.aud-d:hover{background:#e6eefb;border-color:#c6d9f4}
.aud-d.alt{background:#fff;border-style:dashed;color:#7c8794}
.aud-more{font:800 9.5px/1 inherit;color:#7c8794;background:#fff;border:1px solid var(--aud-line);
 border-radius:5px;padding:4px 6px;cursor:pointer}
.aud-more:hover{background:#f4f7fb;color:var(--aud-ink)}
.aud-none{font:800 9.5px/1 inherit;color:var(--aud-nc);background:rgba(207,43,43,.09);
 border-radius:5px;padding:4px 7px;text-transform:uppercase;letter-spacing:.05em}
/* result buttons: an icon carries the meaning, the word confirms it.
   Each has its own colour, so a filled row reads at a glance.            */
.aud-m{flex:0 0 auto;display:flex;gap:4px;margin-left:auto}
/* icon only - the glyph and its colour carry the meaning; the word is in the
   tooltip and in every export */
.aud-mb{display:inline-flex;align-items:center;justify-content:center;
 width:27px;height:26px;padding:0;border:1px solid var(--aud-line);
 background:#fff;border-radius:7px;cursor:pointer;transition:.13s}
.aud-mb i{font-style:normal;font-size:12.5px;line-height:1}
.aud-mb[data-v=C]{color:#8fc0a3}
.aud-mb[data-v=NC]{color:#dda0a0}
.aud-mb[data-v=OFI]{color:#dcbe8a}
.aud-mb[data-v=NA]{color:#b6bfcc}
.aud-mb:hover{background:#f6f8fb;border-color:#cfd8e3;transform:translateY(-1px)}
.aud-mb[data-v=C]:hover{color:var(--aud-ok);border-color:var(--aud-ok)}
.aud-mb[data-v=NC]:hover{color:var(--aud-nc);border-color:var(--aud-nc)}
.aud-mb[data-v=OFI]:hover{color:var(--aud-of);border-color:var(--aud-of)}
.aud-mb[data-v=NA]:hover{color:var(--aud-na);border-color:var(--aud-na)}
.aud-mb.on{color:#fff}
.aud-mb.on[data-v=C]{background:var(--aud-ok);border-color:var(--aud-ok);
 box-shadow:0 2px 9px -3px rgba(20,137,63,.85)}
.aud-mb.on[data-v=NC]{background:var(--aud-nc);border-color:var(--aud-nc);
 box-shadow:0 2px 9px -3px rgba(207,43,43,.85)}
.aud-mb.on[data-v=OFI]{background:var(--aud-of);border-color:var(--aud-of);
 box-shadow:0 2px 9px -3px rgba(192,122,16,.85)}
.aud-mb.on[data-v=NA]{background:var(--aud-na);border-color:var(--aud-na)}
/* an answered row dims the options it did not choose, so the eye goes to the answer */
.aud-r.mC .aud-mb:not(.on),.aud-r.mNC .aud-mb:not(.on),
.aud-r.mOFI .aud-mb:not(.on),.aud-r.mNA .aud-mb:not(.on){opacity:.42}
.aud-r.mC .aud-mb:not(.on):hover,.aud-r.mNC .aud-mb:not(.on):hover,
.aud-r.mOFI .aud-mb:not(.on):hover,.aud-r.mNA .aud-mb:not(.on):hover{opacity:1}
.aud-cm{flex:0 0 auto;border:1px solid var(--aud-line);background:#fff;border-radius:7px;
 width:27px;height:26px;font-size:11.5px;line-height:1;cursor:pointer;color:#a7b2c0;
 position:relative;transition:.13s;padding:0}
.aud-cm:hover{background:#f4f7fb;color:var(--aud-ink);border-color:#cfd8e3}
.aud-cm.on{border-color:var(--aud-acc);color:var(--aud-acc);background:#fffaf0}
.aud-cm.has{color:var(--aud-acc)}
.aud-cm.has:after{content:'';position:absolute;top:-3px;right:-3px;width:7px;height:7px;
 border-radius:50%;background:var(--aud-acc);border:1.5px solid #fff}
.aud-cw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s cubic-bezier(.2,.8,.3,1)}
.aud-cw.on{grid-template-rows:1fr;margin:-1px 0 5px}
.aud-cw>div{overflow:hidden}
.aud-ev{width:100%;border:1px solid var(--aud-line);border-radius:8px;padding:7px 10px;
 font:500 11.8px/1.45 inherit;resize:vertical;min-height:34px;background:#fbfcfe;margin-top:3px}
.aud-ev:focus{outline:0;border-color:var(--aud-acc);background:#fff;box-shadow:0 0 0 3px rgba(200,149,31,.14)}
.aud-empty{background:#fff;border:1px dashed var(--aud-line);border-radius:11px;padding:26px;
 text-align:center;color:var(--aud-mut);font-size:12.5px}
@media (max-width:900px){ .aud-lens{display:none} }
@media (max-width:640px){
  .aud-wrap{padding:10px 11px 46px}
  .aud-bar{margin:0 -11px 10px;padding:9px 11px}
  .aud-id{order:-1;width:100%;flex:1 0 100%}
  .aud-q{font-size:12.6px}
  .aud-dl{flex:1 0 100%;margin-left:0;order:1}
  .aud-m{order:2;margin-left:auto;gap:5px}
  .aud-mb{width:32px;height:30px}
  .aud-mb i{font-size:14px}
  .aud-cm{order:3;width:32px;height:31px}
  .aud-k{min-width:76px;padding:7px 10px}
  .aud-k b{font-size:17px}
}
@media print{
  .hdr,.aud-bar,.aud-tabs,.aud-f,.aud-more{display:none!important}
  body.aud-on{background:#fff}
  .aud-r{break-inside:avoid;box-shadow:none;margin-bottom:2px;border-radius:0}
  .aud-q{white-space:normal!important}
  .aud-cw{grid-template-rows:1fr!important}
}
</style>

<style id="map-css">
:root{--mp-ink:#23211E;--mp-dim:#8C877D;--mp-line:#E3E0D8;--mp-paper:#FBFAF7;--mp-teal:#0F6E56}
.map-toggle{display:inline-flex;align-items:center;gap:7px;background:#fff;color:#23211E;
 border:1px solid #D6D2C8;border-radius:999px;padding:8px 15px;font:500 12.5px/1 inherit;
 cursor:pointer;white-space:nowrap;transition:.16s;margin-left:8px}

 border-bottom:1px solid var(--mp-line);flex-wrap:wrap}

.mp-t,.mp-c,.mp-f{flex:0 0 auto}

 color:#6E6A62;cursor:pointer;background:#fff;transition:.14s}

.mp-t.on{background:var(--mp-ink);color:var(--mp-paper);border-color:var(--mp-ink)}

 border-radius:6px;border:1px solid var(--mp-line);background:#fff;color:#57534C;cursor:pointer;transition:.14s}
.mp-c .sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.mp-c b{font-weight:400;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10px;opacity:.6}
.mp-c.on{border-color:var(--mp-ink);box-shadow:inset 0 0 0 1px var(--mp-ink);color:var(--mp-ink)}
.mp-f{font-size:10.5px;padding:2.5px 8px;border-radius:5px;border:1px solid #E9E5DC;background:#fff;
 color:#6E6A62;cursor:pointer;font-family:ui-monospace,Menlo,Consolas,monospace}

.mp-row.fam{padding:0 0 9px;border-bottom:1px solid #EFEDE6;gap:5px}
.mp-btn{font-size:10.5px;padding:2px 8px;border:1px solid var(--mp-line);border-radius:5px;
 background:#fff;color:#6E6A62;cursor:pointer}
.mp-btn:hover{border-color:#C9C4B8;color:var(--mp-ink)}
.mp-stat{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:10.5px;color:var(--mp-dim)}
#mp-sv{display:block;width:100%;margin-top:8px}
#mp-grid text.lane{font-size:11px;font-weight:500;letter-spacing:.02em}
#mp-grid text.lanen{font-size:9px;font-family:ui-monospace,Menlo,Consolas,monospace;fill:#A8A296}

 font-family:ui-monospace,Menlo,Consolas,monospace}

 font-family:ui-monospace,Menlo,Consolas,monospace;pointer-events:none}

@keyframes mpSnap{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}

<div class="qr-modal" id="qrModal" onclick="closeQR(event)">

</div>

<div class="hdr">
  <div class="hdr-inner">

      <div>
        <div class="hdr-name">Pack Masters ISO Portal</div>
        <div class="hdr-tagline">Contract Packaging · Rabale MIDC, Navi Mumbai</div>
      </div>
    </div>
    <div class="hdr-stds">
      <span class="hdr-std" style="background:#dbeafe;color:#1e40af">9001</span>
      <span class="hdr-std" style="background:#dcfce7;color:#166534">14001</span>
      <span class="hdr-std" style="background:#fef3c7;color:#92400e">45001</span>
    </div>
    <div class="hdr-n">
      <span class="hn"><b id="sn">182</b>docs</span><i></i>
      <span class="hn"><b>13</b>categories</span><i></i>
      <span class="hn"><b>39</b>clauses</span>

const STD_BG={"9001":"#dbeafe","14001":"#dcfce7","45001":"#fef3c7","IMS":"#ede9fe","":"#f1f5f9"};
const STD_FG={"9001":"#1e40af","14001":"#166534","45001":"#92400e","IMS":"#5b21b6","":"#475569"};
const CAT_BG={"FRM":"#eff6ff","REG":"#f0fdf4","QSP":"#faf5ff","SOP":"#faf5ff","WI":"#fff7ed","POL":"#fdf4ff","PLN":"#f0f9ff","QMP":"#eef2ff","TRN":"#f0fdf4","LST":"#f8fafc","OH":"#fff1f2","EP":"#fff1f2","IAC":"#eef2ff","RR":"#fff1f2","QP":"#ecfeff"};
const CAT_FG={"FRM":"#1d4ed8","REG":"#15803d","QSP":"#7e22ce","SOP":"#7e22ce","WI":"#c2410c","POL":"#a21caf","PLN":"#0369a1","QMP":"#3730a3","TRN":"#15803d","LST":"#475569","OH":"#be123c","EP":"#be123c","IAC":"#3730a3","RR":"#be123c","QP":"#0e7490"};

let std="", sortKey="code";
const SORTS=["code","title","standard","clause"]; let si=0;

function toggleSort(){
  si=(si+1)%SORTS.length; sortKey=SORTS[si];
  document.getElementById("sortLbl").textContent="Sort: "+sortKey[0].toUpperCase()+sortKey.slice(1);
  go();
}
document.querySelectorAll("#chips .chip").forEach(c=>c.onclick=function(){
  std=this.dataset.s;
  document.querySelectorAll("#chips .chip").forEach(x=>x.classList.remove("on"));
  this.classList.add("on");
  document.getElementById("rstd").textContent=std?"Filtered: ISO "+std:"";
  go();
});
function filterClause(c){document.getElementById("fcl").value=c;go();}
function clearQ(){document.getElementById("q").value="";document.getElementById("xbtn").style.display="none";go();}
function reset(){
  std="";si=0;sortKey="code";
  document.getElementById("sortLbl").textContent="Sort: Code";
  document.querySelectorAll("#chips .chip").forEach((c,i)=>c.classList.toggle("on",i===0));
  ["q","fcl"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("xbtn").style.display="none";
  document.getElementById("rstd").textContent="";
  go();
}
function openQR(code,title,url){
  const m=document.getElementById("qrModal");
  document.getElementById("qrImg").src="data:image/png;base64,"+QR[code];
  document.getElementById("qrCode").textContent=code;
  document.getElementById("qrTitle").textContent=title;
  document.getElementById("qrUrl").textContent=url;
  m.classList.add("show");
}
function closeQR(e){
  if(e.target===document.getElementById("qrModal"))
    document.getElementById("qrModal").classList.remove("show");
}
function go(){
  const q=document.getElementById("q").value.toLowerCase().trim();
  const cl=document.getElementById("fcl").value;
  document.getElementById("xbtn").style.display=q?"block":"none";
  let r=D.filter(d=>
    (!std||d.standard===std)&&(!cl||d.clause===cl)&&
    (!q||(d.code.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||d.clause.includes(q)))
  );
  r.sort((a,b)=>{
    let av=a[sortKey]||"",bv=b[sortKey]||"";
    if(sortKey==="clause"){const p=x=>x.split(".").map(n=>isNaN(n)?n:n.padStart(5,"0")).join(".");av=p(av);bv=p(bv);}
    return av<bv?-1:av>bv?1:0;
  });
  document.getElementById("rbar").textContent=r.length+" document"+(r.length!==1?"s":"");
  document.getElementById("sn").textContent=r.length;
  const groups={};
  r.forEach(d=>{(groups[d.cat_label]||(groups[d.cat_label]=[])).push(d);});
  const main=document.getElementById("main");
  if(!r.length){main.innerHTML='<div class="no-results">No documents match your filters.</div>';return;}
  main.innerHTML=Object.entries(groups).map(([cat,items])=>{
    const f=items[0];
    const rows=items.map(d=>`<tr>
      <td class="code-cell">${d.code}</td>
      <td class="title-cell"><a href="${d.url}" target="_blank">${d.title}</a></td>
      <td class="col-std"><span class="std-pill" style="background:${STD_BG[d.standard]||"#f1f5f9"};color:${STD_FG[d.standard]||"#475569"}">${d.standard||"—"}</span></td>
      <td class="clause-cell col-clause">${d.clause?`<a href="#" onclick="filterClause('${d.clause}');return false">§${d.clause}</a>`:"—"}</td>
      <td class="qr-cell">${QR[d.code]?`<img src="data:image/png;base64,${QR[d.code]}" alt="QR" title="Scan to open ${d.code}" onclick="openQR('${d.code}','${d.title.replace(/'/g,"\\'")}',${JSON.stringify(d.url)})">`:""}
      </td>
    </tr>`).join("");
    const cards=items.map(d=>`<div class="doc-card">
      <div class="doc-card-top">
        <div class="doc-card-title"><a href="${d.url}" target="_blank">${d.title}</a></div>
        ${QR[d.code]?`<div class="doc-card-qr"><img src="data:image/png;base64,${QR[d.code]}" alt="QR" onclick="openQR('${d.code}','${d.title.replace(/'/g,"\\'")}',${JSON.stringify(d.url)})"></div>`:""}
      </div>
      <div class="doc-card-meta">
        <span class="doc-card-code">${d.code}</span>
        <span class="std-pill" style="background:${STD_BG[d.standard]||"#f1f5f9"};color:${STD_FG[d.standard]||"#475569"}">${d.standard||"—"}</span>
        ${d.clause?`<span class="doc-card-clause">§${d.clause}</span>`:""}
      </div>
    </div>`).join("");
    return `<div class="cat-sec">
      <div class="cat-hdr" onclick="this.parentElement.classList.toggle('open')">
        <div class="cat-hdr-l">
          <span class="cat-pill" style="background:${CAT_BG[f.cat]||"#f1f5f9"};color:${CAT_FG[f.cat]||"#475569"}">${f.cat}</span>
          <span class="cat-name">${cat}</span>
          <span class="cat-n">${items.length}</span>
        </div>
        <span class="cat-arrow">▼</span>
      </div>
      <div class="cat-body">
        <table>
          <thead><tr>
            <th>Code</th><th>Title</th>
            <th class="col-std">Standard</th>
            <th class="col-clause">Clause</th>
            <th></th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
        <div class="doc-cards">${cards}</div>
      </div>
    </div>`;
  }).join("");
}
go();
</script>











<script id="pf-js">
(function(){
const GRP=[
 ['Forms','ti-file-text',['#E6F1FB','#B5D4F4','#185FA5','#0C447C']],
 ['Registers','ti-table',['#E1F5EE','#9FE1CB','#0F6E56','#085041']],
 ['Procedures','ti-list-numbers',['#EEEDFE','#CECBF6','#534AB7','#3C3489']],
 ['Work instructions','ti-tools',['#FAECE7','#F5C4B3','#993C1D','#712B13']],
 ['OHS','ti-shield-check',['#FAEEDA','#FAC775','#854F0B','#633806']],
 ['Signage','ti-alert-triangle',['#FCEBEB','#F7C1C1','#A32D2D','#791F1F']],
 ['Plans','ti-calendar',['#EAF3DE','#C0DD97','#3B6D11','#27500A']],
 ['Policies','ti-award',['#FBEAF0','#F4C0D1','#993556','#72243E']]];
const SC={'9001':['#E6F1FB','#0C447C'],'14001':['#E1F5EE','#085041'],'45001':['#FAEEDA','#633806']};
let sel=0, fam='', act=null;
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function base(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  const cl=document.getElementById('fcl').value;
  return D.filter(d=>(!std||d.standard===std)&&(!cl||d.clause===cl)&&
    (!q||(d.code.toLowerCase().includes(q)||d.title.toLowerCase().includes(q)||String(d.clause).includes(q))));
}
function inGrp(list,g){ return list.filter(d=>d.grp===g); }

function pane(d){
  if(!d) return '<div class="pf-empty">Hover a document to see its detail.<br>Click to open it.</div>';
  const r=GRP[sel][2], qr=(typeof QR!=='undefined')&&QR[d.code];
  const log=(d.log&&d.log.length)?d.log:[['—','','No revision history recorded','']];
  const m=(l,v,sub)=>v?`<div class="pf-m"><b>${l}</b><span>${esc(v)}${sub?' <span class="sub">'+esc(sub)+'</span>':''}</span></div>`:'';
  return `<div class="in">
    <div style="display:flex;gap:12px;align-items:flex-start;margin-bottom:8px">
      <div style="flex:1;min-width:0">
        <div class="pf-ttl">${esc(d.title)}</div>
        <code style="font-size:10.5px;color:#64748b">${esc(d.code)}</code>
      </div>
      ${qr?`<div style="flex:0 0 auto"><img class="pf-qr" alt="QR code for ${esc(d.code)}"
         src="data:image/png;base64,${qr}"><div class="pf-cap">scan to open</div></div>`:''}
    </div>
    <div class="pf-lbl">DOCUMENT INFORMATION</div>
    ${m('Owner',d.own,d.ownt)}${m('Approved by',d.ap,d.apt)}${m('Department',d.dept)}
    ${m('Standard',d.standard?('ISO '+d.standard+(d.clause?'  §'+d.clause:'')):'')}
    ${m('Revision',d.ver||d.version)}${m('Effective',d.eff)}${m('Next review',d.rvw)}${m('Retention',d.ret)}
    <div class="pf-lbl">CHANGE LOG</div>
    ${log.map(l=>`<div class="pf-lg"><span class="v" style="color:${l[0]&&l[0]!=='—'?r[2]:'#9aa6b6'}">${esc(l[0]||'—')}</span>
      <span class="d">${esc(l[1])}</span><span class="x">${esc(l[2])}${l[3]?' <span class="sub" style="color:#64748b">— '+esc(l[3])+'</span>':''}</span></div>`).join('')}
    <div class="pf-act">
      <a class="pf-b" href="${esc(d.url||('html/'+d.code+'.html'))}" target="_blank" rel="noopener">
        <i class="ti ti-external-link" aria-hidden="true"></i> Open</a>
    </div></div>`;
}

function render(){
  const list=base();
  const host=document.getElementById('pf'); if(!host) return;
  const counts=GRP.map(g=>inGrp(list,g[0]).length);
  if(counts[sel]===0){ const f=counts.findIndex(c=>c>0); if(f>=0) sel=f; }
  const items=inGrp(list,GRP[sel][0]);
  const fams=[...new Set(items.map(d=>d.fam))].sort();
  if(fam&&fams.indexOf(fam)<0) fam='';
  const shown=fam?items.filter(d=>d.fam===fam):items;
  if(!shown.some(d=>d.code===act)) act=null;
  const cur=shown.find(d=>d.code===act)||null;
  const r=GRP[sel][2];

  host.innerHTML=
   `<div class="pf-sp" role="tablist">${GRP.map((g,i)=>{const on=i===sel,c=g[2];
     return `<button class="pf-t${on?' on':''}" role="tab" aria-selected="${on}" data-i="${i}"
       style="background:${on?c[0]:'#fff'};border:1px solid ${on?c[2]:c[1]};box-shadow:${on?'0 0 0 3px '+c[0]:'none'}">
       <i class="ti ${g[1]} ic" aria-hidden="true" style="color:${on?c[2]:'#94a3b8'}"></i>
       <span class="nm" style="color:${on?c[3]:'#64748b'}">${g[0]}</span>
       <span class="ct" style="background:${on?'#fff':'#f1f5f9'};color:${on?c[2]:'#94a3b8'}">${counts[i]}</span>
     </button>`}).join('')}</div>
    <div class="pf-sec" style="border:1px solid ${r[2]}">
      <div class="pf-hd" style="background:${r[0]}">
        <i class="ti ${GRP[sel][1]}" aria-hidden="true" style="font-size:15px;color:${r[2]}"></i>
        <span class="ti" style="color:${r[3]}">${GRP[sel][0]}</span>
        <span class="pill" style="color:${r[2]}">${items.length}</span>
        ${fams.length>1?`<div class="pf-fam">${[''].concat(fams).map(f=>{
          const n=f?items.filter(d=>d.fam===f).length:items.length, on=fam===f;
          return `<button class="pf-fc" data-f="${esc(f)}" style="color:${r[3]};
            background:${on?'#fff':'rgba(255,255,255,.6)'};border-color:${on?r[2]:'transparent'}">${f||'All'} ${n}</button>`;
        }).join('')}</div>`:''}
      </div>
      <div class="pf-body">
        <div class="pf-list">${shown.length?shown.map(d=>{
          const sc=SC[d.standard]||['#f1f5f9','#475569'], on=d.code===act;
          return `<div class="pf-r${on?' act':''}" data-code="${esc(d.code)}" tabindex="0" role="button"
             ><code>${esc(d.code.replace(/^PM_/,''))}</code>
            <span class="tt">${esc(d.title)}</span>
            <span class="sd" style="background:${sc[0]};color:${sc[1]}">${esc(d.standard||'—')}</span>
            <span class="cl">${d.clause?'§'+esc(d.clause):''}</span>
            <i class="ti ti-info-circle ax pf-i" aria-hidden="true" title="Show detail"></i>
            <i class="ti ti-external-link ax" aria-hidden="true" style="color:${r[2]}"></i>
          </div>`}).join(''):'<div class="pf-empty">No documents match these filters.</div>'}</div>
        <div class="pf-pane">${pane(cur)}</div>
      </div>
    </div>`;
  const st=host.querySelector('.pf-r.act');
  if(st) st.style.boxShadow='inset 3px 0 0 '+r[2];
}

// Update only what changed: the previously active row, the new row, and the
// panel. A full render() rebuilds 73 rows and is far too slow to sit on hover.
function setAct(code){
  if(act===code) return;
  const host=document.getElementById('pf'); if(!host) return;
  const prev=host.querySelector('.pf-r.act');
  if(prev){ prev.classList.remove('act'); prev.style.boxShadow=''; }
  act=code;
  const row=host.querySelector('.pf-r[data-code="'+(window.CSS&&CSS.escape?CSS.escape(code):code)+'"]');
  if(row){ row.classList.add('act'); row.style.boxShadow='inset 3px 0 0 '+GRP[sel][2][2]; }
  const p=host.querySelector('.pf-pane');
  if(p) p.innerHTML=pane(D.find(x=>x.code===code)||null);
}

document.addEventListener('mouseover',e=>{
  const rw=e.target.closest('#pf .pf-r'); if(!rw) return;
  setAct(rw.dataset.code);
});
document.addEventListener('pointerdown',e=>{
  const rw=e.target.closest('#pf .pf-r'); if(rw) setAct(rw.dataset.code);
},{passive:true});
document.addEventListener('focusin',e=>{
  const rw=e.target.closest('#pf .pf-r'); if(rw) setAct(rw.dataset.code);
});
document.addEventListener('click',e=>{
  const t=e.target.closest('#pf .pf-t');
  if(t){ sel=+t.dataset.i; fam=''; act=null; render(); return; }
  const f=e.target.closest('#pf .pf-fc');
  if(f){ fam=f.dataset.f; act=null; render(); return; }
  const i=e.target.closest('#pf .pf-i');
  if(i){ e.stopPropagation(); setAct(i.closest('.pf-r').dataset.code); return; }
  const rw=e.target.closest('#pf .pf-r');
  if(rw){ const d=D.find(x=>x.code===rw.dataset.code);
    if(d) window.open(d.url||('html/'+d.code+'.html'),'_blank','noopener'); }
});
document.addEventListener('keydown',e=>{
  const rw=e.target.closest('#pf .pf-r'); if(!rw) return;
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); rw.click(); return; }
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    e.preventDefault();
    const all=[...document.querySelectorAll('#pf .pf-r')];
    const n=all[all.indexOf(rw)+(e.key==='ArrowDown'?1:-1)];
    if(n) n.focus();
  }
});

document.body.classList.add('pf-on');
const _go=window.go;
window.go=function(){ _go.apply(this,arguments); render(); };
if(document.readyState!=='loading') render();
else document.addEventListener('DOMContentLoaded',render);
})();
</script>

1-8.1.3", "std": "45001", "cl": "8.1.3", "req": "Is change managed - new products, processes, equipment, legal changes and knowledge of hazards?", "sq": "SD", "he": "HS", "sec": "8"}, {"id": "45001-8.1.4", "std": "45001", "cl": "8.1.4", "req": "Is procurement controlled, including contractors and outsourced functions, to conform to the OH&SMS?", "sq": "SCD", "he": "HS", "sec": "8"}, {"id": "45001-8.2", "std": "45001", "cl": "8.2", "req": "Is emergency preparedness planned, with response, periodic testing, training and communication?", "sq": "SP", "he": "HES", "sec": "8"}, {"id": "45001-9.1.1", "std": "45001", "cl": "9.1.1", "req": "Is OH&S performance monitored and measured, with criteria and calibrated equipment?", "sq": "SC", "he": "HS", "sec": "9"}, {"id": "45001-9.1.2", "std": "45001", "cl": "9.1.2", "req": "Is compliance with legal and other requirements evaluated and its status maintained?", "sq": "SC", "he": "HS", "sec": "9"}, {"id": "45001-9.2", "std": "45001", "cl": "9.2", "req": "Are internal OH&S audits conducted at planned intervals, with results reported to workers?", "sq": "SP", "he": "HS", "sec": "9"}, {"id": "45001-9.3", "std": "45001", "cl": "9.3", "req": "Does management review cover incidents, participation, hazards, risks, and adequacy of resources?", "sq": "SCD", "he": "HS", "sec": "9"}, {"id": "45001-10.1", "std": "45001", "cl": "10.1", "req": "Are opportunities for improvement determined and improvement actions implemented?", "sq": "SCD", "he": "HS", "sec": "10"}, {"id": "45001-10.2", "std": "45001", "cl": "10.2", "req": "Are incidents and nonconformities investigated, root causes determined and controls reviewed?", "sq": "SP", "he": "HS", "sec": "10"}, {"id": "45001-10.3", "std": "45001", "cl": "10.3", "req": "Is the OH&S management system continually improved, with worker participation?", "sq": "SP", "he": "HS", "sec": "10"}];
const SQ_NAME={S:'Safety',Q:'Quality',C:'Cost',D:'Delivery',P:'People'};
const HE_NAME={H:'Health',E:'Environment',S:'Safety',Q:'Quality'};
const STD_DOT={'9001':'#1d5fc4','14001':'#14893f','45001':'#c07a10'};
const AUD_KEY='pm-audit-v2';
let audState={}, audMeta={name:'',date:''};
try{ const raw=JSON.parse(localStorage.getItem(AUD_KEY)||'{}');
     audState=raw.marks||{}; audMeta=raw.meta||{name:'',date:''}; }catch(e){}
let audF={tab:'', std:'', lens:'', st:'', q:''};
let audOpen=null;      // clause whose remark box is open
let audAllOf=null;     // clause showing its full document list
const MARK_T={C:'Conforming',NC:'Non-conformity',OFI:'Opportunity for improvement',NA:'Not applicable'};
const MARK_I={C:'✓',NC:'✕',OFI:'△',NA:'–'};   // tick, cross, triangle, dash
const audEsc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function audSave(){ try{localStorage.setItem(AUD_KEY,JSON.stringify({marks:audState,meta:audMeta}));}catch(e){} }

function audClauseHit(cl,target){
  if(!cl) return false;
  const rng=cl.match(/^\s*(\d+)(?:\.\d+)*\s*[-–—]\s*(\d+)(?:\.\d+)*\s*$/);
  if(rng){const top=parseInt(target,10); return top>=parseInt(rng[1],10)&&top<=parseInt(rng[2],10);}
  return cl.split(/[^0-9.]+/).filter(Boolean).some(tok=>{
    tok=tok.replace(/\.$/,'');
    return tok===target||tok.indexOf(target+'.')===0||target.indexOf(tok+'.')===0;});
}
// a document's primary clause plus any it explicitly declares coverage of
function audCovers(d,target){
  if(audClauseHit(String(d.clause||''),target)) return true;
  return (d.covers||[]).some(c=>audClauseHit(String(c),target));
}
function audDocs(it){
  if(typeof D==='undefined') return {same:[],other:[]};
  const same=[],other=[];
  D.forEach(d=>{ if(!audCovers(d,it.cl)) return;
    const s=String(d.standard||'');
    (!s||s===it.std)?same.push(d):other.push(d); });
  // the document written for this clause is more use to an auditor than the
  // manual, which declares coverage of nearly all of them - so list it first
  const rank=d=>audClauseHit(String(d.clause||''),it.cl)?0:1;
  same.sort((a,b)=>rank(a)-rank(b)); other.sort((a,b)=>rank(a)-rank(b));
  return {same,other};
}
// documents that no clause check reaches - shown in their own tab
function audUnmapped(){
  if(typeof D==='undefined') return [];
  const seen=new Set();
  AUD_ITEMS.forEach(it=>{const g=audDocs(it); g.same.concat(g.other).forEach(d=>seen.add(d.code));});
  return D.filter(d=>!seen.has(d.code));
}
let AUD_UNMAPPED=[];

function audLens(it){ return it.sq.split('').map(x=>SQ_NAME[x]).concat(
    it.he.split('').map(x=>HE_NAME[x])).filter((v,i,a)=>a.indexOf(v)===i); }

function audMatch(it,docs){
  if(audF.tab && audF.tab!=='gap' && audF.tab!=='un' && it.sec!==audF.tab) return false;
  if(audF.tab==='gap' && (docs.same.length||docs.other.length)) return false;
  if(audF.std && it.std!==audF.std) return false;
  if(audF.lens && audLens(it).indexOf(audF.lens)<0) return false;
  const st=(audState[it.id]||{}).v||'';
  if(audF.st==='_'&&st) return false;
  if(audF.st==='!'&&(docs.same.length||docs.other.length)) return false;
  if(audF.st&&audF.st!=='_'&&audF.st!=='!'&&st!==audF.st) return false;
  if(audF.q){ const h=(it.cl+' '+it.req+' '+it.std+' '+docs.same.concat(docs.other).map(d=>d.code).join(' ')).toLowerCase();
    if(h.indexOf(audF.q.toLowerCase())<0) return false; }
  return true;
}

function audRender(){
  const n={C:0,NC:0,OFI:0,NA:0,_:0}; let gaps=0;
  const rows=[];
  AUD_ITEMS.forEach(it=>{
    const docs=audDocs(it);
    if(!docs.same.length&&!docs.other.length) gaps++;
    const st=(audState[it.id]||{}).v||'_'; n[st]=(n[st]||0)+1;
    if(audMatch(it,docs)) rows.push([it,docs]);
  });

  // tabs
  const secs=['4','5','6','7','8','9','10'];
  const cnt=s=>AUD_ITEMS.filter(i=>i.sec===s).length;
  document.getElementById('audTabs').innerHTML=
    `<button class="aud-t${audF.tab===''?' on':''}" data-tab="">All<i>${AUD_ITEMS.length}</i></button>`+
    secs.map(s=>`<button class="aud-t${audF.tab===s?' on':''}" data-tab="${s}">Clause ${s}<i>${cnt(s)}</i></button>`).join('')+
    `<button class="aud-t${audF.tab==='gap'?' on':''}" data-tab="gap">Gaps<i>${gaps}</i></button>`+
    `<button class="aud-t${audF.tab==='un'?' on':''}" data-tab="un">Unmapped<i>${AUD_UNMAPPED.length}</i></button>`;

  // filter row 1
  const chip=(f,v,l)=>`<button class="aud-c${audF[f]===v?' on':''}" data-f="${f}" data-v="${v}">${l}</button>`;
  document.getElementById('audF1').innerHTML=
    '<span class="lb">Std</span>'+chip('std','','All')+chip('std','9001','9001')+chip('std','14001','14001')+chip('std','45001','45001')+
    '<span class="lb" style="margin-left:6px">Lens</span>'+chip('lens','','All')+
    ['Safety','Quality','Cost','Delivery','People','Health','Environment'].map(x=>chip('lens',x,x)).join('');

  // KPI
  const done=n.C+n.NC+n.OFI+n.NA;
  const pct=(n.C+n.NC+n.OFI)?Math.round(n.C*100/(n.C+n.NC+n.OFI)):0;
  document.getElementById('audKpi').innerHTML=
    `<div class="aud-k"><b>${AUD_ITEMS.length}</b><span>Clauses</span></div>
     <div class="aud-k" style="--c:var(--aud-ok)"><b>${n.C}</b><span>Conforming</span></div>
     <div class="aud-k" style="--c:var(--aud-nc)"><b>${n.NC}</b><span>Non-conf</span></div>
     <div class="aud-k" style="--c:var(--aud-of)"><b>${n.OFI}</b><span>OFI</span></div>
     <div class="aud-k" style="--c:var(--aud-na)"><b>${n.NA}</b><span>N/A</span></div>
     <div class="aud-k"><b>${n._}</b><span>Open</span></div>
     <div class="aud-k" style="--c:${gaps?'var(--aud-nc)':'var(--aud-ok)'}"><b>${gaps}</b><span>No document</span></div>`;
  document.getElementById('audPct').textContent=pct+'%';
  document.getElementById('audDone').textContent=done+' of '+AUD_ITEMS.length;
  const arc=document.getElementById('audArc');
  if(arc) arc.setAttribute('stroke-dasharray',(94.2*done/AUD_ITEMS.length).toFixed(1)+' 94.2');

  const list=document.getElementById('audList');
  if(audF.tab==='un'){
    list.innerHTML='<div class="aud-grp">Documents no clause check reaches &mdash; signage, pictograms and samples carry no clause reference</div>'+
      (AUD_UNMAPPED.length?AUD_UNMAPPED.map(d=>
        `<div class="aud-r">
          <span class="aud-cl">${d.cat_label||'Doc'}</span>
          <span class="aud-q">${audEsc(d.title||d.code)}</span>
          <span class="aud-dl"><a class="aud-d" href="html/${d.code}.html" target="_blank">${d.code}</a></span>
         </div>`).join('')
        :'<div class="aud-empty">Every document is reachable from a clause check.</div>');
    return;
  }
  if(!rows.length){ list.innerHTML='<div class="aud-empty">No clause matches these filters.</div>'; return; }

  const groups={};
  rows.forEach(([it,docs])=>{ (groups[it.sec]=groups[it.sec]||[]).push([it,docs]); });
  let html='';
  Object.keys(groups).sort((a,b)=>(+a)-(+b)).forEach(sec=>{
    html+=`<div class="aud-grp">Clause ${sec}</div>`;
    groups[sec].forEach(([it,docs])=>{
      const cur=audState[it.id]||{};
      // document references, prefilled from the index: primary clause + declared coverage
      const mk=(d,cls)=>`<a class="aud-d${cls}" href="html/${d.code}.html" target="_blank"
        title="${audEsc(d.title||d.code)}${cls?' — other standard':''}">${d.code}</a>`;
      const all=docs.same.map(d=>mk(d,'')).concat(docs.other.map(d=>mk(d,' alt')));
      const SHOW=3;
      let dl=all.length
        ? all.slice(0,SHOW).join('')+(all.length>SHOW
            ?`<button class="aud-more" onclick="audAll('${it.id}')" title="Show all ${all.length}">+${all.length-SHOW}</button>`:'')
        : '<span class="aud-none" title="No controlled document declares this clause">none</span>';
      if(audAllOf===it.id) dl=all.join('');
      const marks=['C','NC','OFI','NA'].map(v=>
        `<button class="aud-mb${cur.v===v?' on':''}" data-v="${v}" title="${MARK_T[v]}"
          onclick="audMark('${it.id}','${v}')" aria-label="${MARK_T[v]}"><i>${MARK_I[v]}</i></button>`).join('');
      const open=audOpen===it.id;
      html+=`<div class="aud-r${cur.v?' m'+cur.v:''}${!all.length?' gap':''}${open?' open':''}" id="i-${it.id}">
        <div class="aud-r1">
          <span class="aud-cl">${it.cl}</span>
          <span class="aud-sd" style="background:${STD_DOT[it.std]}" title="ISO ${it.std}"></span>
          <span class="aud-q">${audEsc(it.req)}</span>
          <span class="aud-lens">${audLens(it).map(x=>
            `<span class="aud-tag ${['Health','Environment'].indexOf(x)>=0?'he':'sq'}" title="${x}">${x[0]}</span>`).join('')}</span>
        </div>
        <div class="aud-r2">
          <span class="aud-dl">${dl}</span>
          <span class="aud-m">${marks}</span>
          <button class="aud-cm${cur.e?' has':''}${open?' on':''}" onclick="audFlip('${it.id}')"
            title="${cur.e?'Remark: '+audEsc(cur.e).slice(0,120):'Add remark'}">&#128172;</button>
        </div>
      </div>
      <div class="aud-cw${open?' on':''}"><div><textarea class="aud-ev" id="e-${it.id}"
        placeholder="Objective evidence seen / finding — ${it.cl}"
        oninput="audNote('${it.id}',this.value)">${audEsc(cur.e||'')}</textarea></div></div>`;
    });
  });
  list.innerHTML=html;
}

function audFlip(id){ audOpen=(audOpen===id?null:id); audRender();
  if(audOpen){const el=document.getElementById('e-'+id);
    if(el){ el.focus(); el.scrollIntoView({block:'nearest',behavior:'smooth'}); }} }
function audAll(id){ audAllOf=(audAllOf===id?null:id); audRender(); }
function audMark(id,v){ const c=audState[id]||{}; c.v=(c.v===v?'':v); audState[id]=c; audSave(); audRender(); }
function audNote(id,v){ const c=audState[id]||{}; c.e=v; audState[id]=c; audSave();
  const r=document.getElementById('i-'+id);      // keep the icon in step without re-rendering
  if(r){ const b=r.querySelector('.aud-cm'); if(b) b.classList.toggle('has',!!v); } }
function audReset(){ if(!confirm('Clear all marks and notes in this browser?'))return;
  audState={}; audSave(); audRender(); }

function audRows(){
  return AUD_ITEMS.map(it=>{ const c=audState[it.id]||{}, g=audDocs(it);
    return {std:'ISO '+it.std, cl:it.cl, req:it.req, lens:audLens(it).join(' / '),
      docs:g.same.map(d=>d.code).join(', '), other:g.other.map(d=>d.code).join(', '),
      res:c.v||'', ev:c.e||''}; });
}
function audHdr(){
  audMeta.name=document.getElementById('audName').value;
  audMeta.date=document.getElementById('audDate').value;
  audSave();
  return {n:audMeta.name||'(auditor not named)', d:audMeta.date||new Date().toISOString().slice(0,10)};
}
function audXlsx(){
  const h=audHdr(), r=audRows();
  const aoa=[['Pack Masters — IMS Clause Conformity Audit'],
             ['Auditor',h.n,'','Audit Date',h.d],
             [],
             ['Standard','Clause','Requirement / Audit Question','SQCDP / HESQ',
              'Reference Documents','Other-standard Docs','Result','Objective Evidence / Finding']];
  r.forEach(x=>aoa.push([x.std,x.cl,x.req,x.lens,x.docs,x.other,x.res,x.ev]));
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:10},{wch:9},{wch:70},{wch:26},{wch:30},{wch:22},{wch:8},{wch:46}];
  ws['!freeze']={xSplit:0,ySplit:4};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Audit Checklist');
  XLSX.writeFile(wb,`PackMasters-IMS-Audit-${h.d}.xlsx`);
}
function audPdf(){
  const h=audHdr(), r=audRows();
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  doc.setFontSize(15); doc.setTextColor(11,21,36);
  doc.text('Pack Masters — IMS Clause Conformity Audit',40,40);
  doc.setFontSize(9.5); doc.setTextColor(90,100,115);
  doc.text(`Auditor: ${h.n}          Audit Date: ${h.d}          ISO 9001:2015 / 14001:2015 / 45001:2018`,40,58);
  doc.autoTable({
    startY:72,
    head:[['Std','Clause','Requirement / Audit Question','SQCDP / HESQ','Ref. Documents','Result','Evidence / Finding']],
    body:r.map(x=>[x.std.replace('ISO ',''),x.cl,x.req,x.lens,x.docs||(x.other?'('+x.other+')':'NONE'),x.res,x.ev]),
    styles:{fontSize:7,cellPadding:3,overflow:'linebreak',valign:'top',lineColor:[228,233,240],lineWidth:.5},
    headStyles:{fillColor:[11,21,36],textColor:255,fontSize:7,fontStyle:'bold'},
    alternateRowStyles:{fillColor:[248,250,252]},
    columnStyles:{0:{cellWidth:32},1:{cellWidth:34},2:{cellWidth:250},3:{cellWidth:96},
                  4:{cellWidth:120},5:{cellWidth:34,halign:'center',fontStyle:'bold'},6:{cellWidth:'auto'}},
    didParseCell:d=>{ if(d.section==='body'&&d.column.index===5){
        const v=d.cell.raw;
        if(v==='C') d.cell.styles.textColor=[20,137,63];
        else if(v==='NC') d.cell.styles.textColor=[207,43,43];
        else if(v==='OFI') d.cell.styles.textColor=[192,122,16]; } },
    margin:{left:40,right:40},
  });
  doc.save(`PackMasters-IMS-Audit-${h.d}.pdf`);
}
function audMail(){
  const h=audHdr(), r=audRows();
  const n={C:0,NC:0,OFI:0,NA:0};
  r.forEach(x=>{ if(n[x.res]!==undefined) n[x.res]++; });
  const nc=r.filter(x=>x.res==='NC'), ofi=r.filter(x=>x.res==='OFI');
  const L=['Pack Masters — IMS Clause Conformity Audit','',
    'Auditor    : '+h.n,'Audit Date : '+h.d,
    'Standards  : ISO 9001:2015 / ISO 14001:2015 / ISO 45001:2018','',
    `Result: ${n.C} conforming, ${n.NC} non-conforming, ${n.OFI} OFI, ${n.NA} not applicable`,
    `Clauses assessed: ${n.C+n.NC+n.OFI+n.NA} of ${r.length}`,''];
  if(nc.length){ L.push('NON-CONFORMITIES'); nc.forEach(x=>L.push(` - ${x.std} ${x.cl}: ${x.req}`,
    `   Finding: ${x.ev||'(not recorded)'}`)); L.push(''); }
  if(ofi.length){ L.push('OPPORTUNITIES FOR IMPROVEMENT'); ofi.forEach(x=>L.push(` - ${x.std} ${x.cl}: ${x.ev||x.req}`)); L.push(''); }
  L.push('Full checklist attached as Excel/PDF export.');
  const body=encodeURIComponent(L.join('\n')).slice(0,7500);
  window.location.href=`mailto:?subject=${encodeURIComponent('IMS Audit — Pack Masters — '+h.d)}&body=${body}`;
}

function audToggle(){
  const on=document.body.classList.toggle('aud-on');
  const b=document.getElementById('audBtn');
  b.classList.toggle('on',on);
  b.querySelector('.tx').textContent=on?'Exit Auditor':'Auditor Mode';
  if(on){
    if(!AUD_UNMAPPED.length) AUD_UNMAPPED=audUnmapped();
    document.getElementById('audName').value=audMeta.name||'';
    document.getElementById('audDate').value=audMeta.date||new Date().toISOString().slice(0,10);
    audRender();
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('#aud .aud-t');
  if(t){ audF.tab=t.dataset.tab; audOpen=null; audRender(); return; }
  const c=e.target.closest('#aud .aud-c');
  if(c){ audF[c.dataset.f]=c.dataset.v; audRender(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='audQ'){ audF.q=e.target.value; audRender(); }
  if(e.target.id==='audName'){ audMeta.name=e.target.value; audSave(); }
  if(e.target.id==='audDate'){ audMeta.date=e.target.value; audSave(); }
});

      +'<div style="margin-top:10px"><div class="mp-k" style="margin-bottom:3px">Cross-references ('+rel.length+')</div>'
      +'<div class="mp-ref">'+(rel.length?rel.map(function(i){
          return '<a href="#" data-go="'+i+'">'+esc(D[i].code.replace("PM_",""))+'</a>';
        }).join("  "):'nothing references this document')+'</div></div>'
      +'</div>';
    [].forEach.call(pan.querySelectorAll("a[data-go]"),function(a){
      a.addEventListener("click",function(e){ e.preventDefault(); sel=+a.dataset.go; render(); });
    });
  }

  function build(){
    if(built) return;
    (typeof MAPE!=="undefined"?MAPE:[]).forEach(function(e){
      (adj[e[0]]=adj[e[0]]||[]).push(e[1]); (adj[e[1]]=adj[e[1]]||[]).push(e[0]);
    });
    Object.keys(adj).forEach(function(k){ adj[k].sort(function(a,b){return (adj[b]||[]).length-(adj[a]||[]).length;}); });
    var best=-1,bn=-1;
    D.forEach(function(d,i){ var n=(adj[i]||[]).length; if(n>bn){ bn=n; best=i; } });
    sel=best;
    [].forEach.call(document.querySelectorAll("#map .mp-t"),function(b){
      b.addEventListener("click",function(){
        [].forEach.call(document.querySelectorAll("#map .mp-t"),function(o){o.classList.remove("on");});
        b.classList.add("on"); lens=b.dataset.l; catOn={}; famOn={}; render();
      });
    });
    document.getElementById("mp-clear").addEventListener("click",function(){ catOn={}; famOn={}; render(); });
    document.getElementById("mp-exit").addEventListener("click",function(){ mapToggle(); });
    built=true;
  }

  window.mapToggle=function(){
    var on=document.body.classList.toggle("map-on");
    if(on && document.body.classList.contains("aud-on")){
      document.body.classList.remove("aud-on");
      var ab=document.getElementById("audBtn");
      if(ab){ ab.classList.remove("on"); var t=ab.querySelector(".tx"); if(t) t.textContent="Auditor Mode"; }
    }
    var b=document.getElementById("mapBtn");
    if(b){ b.classList.toggle("on",on); b.querySelector(".tx").textContent=on?"Exit map":"Document Map"; }
    if(on){ build(); render(); }
    window.scrollTo({top:0,behavior:"smooth"});
  };
})();
</script>

</body>
</html>
